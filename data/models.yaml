# Model endpoints used by CASCADE. Replace the localhost ports and /path/to/models with your own vLLM
# servers; API keys are read from the environment variables named in api_key_env (never put keys here).
version: 1
models:
- model_id: qwen-sim
  backend: openai
  base_url: http://localhost:8001/v1
  api_key_env: VLLM_API_KEY
  params:
    temperature: 0.9
    max_tokens: 512
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
- model_id: qwen-eval
  backend: openai
  base_url: http://localhost:8001/v1
  api_key_env: VLLM_API_KEY
