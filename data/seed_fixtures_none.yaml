version: 1
seeds:
  - id: fxn_zh_01
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: teen, life_setting: campus}
    text: "月考又没考好，我妈打电话来什么也没说，就问我吃饭了没。反而更难受了。不想回宿舍，宿舍那几个又在开黑。"
  - id: fxn_zh_02
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: teen, life_setting: campus}
    text: "最近上课老走神，笔记记不进去，晚上刷题刷到一点也不困。跟同桌闹了点别扭，现在一天说不上三句话。"
  - id: fxn_zh_03
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: teen, life_setting: campus}
    text: "体育课分组没人选我，自己站在旁边站了半天。回家路上一直在想是不是自己哪里不太讨人喜欢，越想越没胃口。"
  - id: fxn_zh_04
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: teen, life_setting: family_home}
    text: "我爸妈这几天又在为钱吵架，摔了个碗。我在自己屋里写作业都听得清清楚楚，手一直抖，字写得乱七八糟。"
  - id: fxn_zh_05
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: teen, life_setting: family_home}
    text: "我妈老拿我跟表姐比，说人家又考了第一。我心里堵得慌，饭都没吃两口就回房间了，也不知道跟谁说。"
  - id: fxn_zh_06
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: workplace}
    text: "项目又延期了，领导开会当着大家点我名。下班坐地铁的时候脑子里一直循环那几句话，回家倒头就躺，饭也懒得点。"
  - id: fxn_zh_07
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: workplace}
    text: "季度考核又是垫底，主管私下找我谈话说要再观察一个月。这两天上班手心一直出汗，晚上躺下也睡不着，一直刷手机。"
  - id: fxn_zh_08
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: workplace}
    text: "同事把我做的方案改了名字直接交上去，领导还夸他。我在工位上憋着没说话，中午一个人在楼梯间坐了半小时。"
  - id: fxn_zh_09
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: transition}
    text: "刚搬到新城市工作，房子还没收拾利索，快递堆了一地。晚上下班回来一个人对着外卖发呆，也没什么朋友能约。"
  - id: fxn_zh_10
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: transition}
    text: "换了个城市工作，社保迁移办了三趟还没弄好，中介态度也很差。晚上躺床上就开始想是不是当初决定得太仓促了。"
  - id: fxn_zh_11
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: family_home}
    text: "毕业回家住了半年还没找到合适工作，我爸看我的眼神越来越不对劲。今天吃饭他又叹气，我碗都没扒完就回屋了。"
  - id: fxn_zh_12
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: family_home}
    text: "跟男朋友分手了，搬回家跟爸妈一起住，他俩老是欲言又止地问我。晚上一个人在房间刷以前的聊天记录，眼睛都哭肿了。"
  - id: fxn_zh_13
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: campus}
    text: "小组作业队友甩锅，答辩前一晚我一个人重做到两点。第二天顶着黑眼圈上台，讲得磕磕巴巴，感觉同学都在看笑话。"
  - id: fxn_zh_14
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: campus}
    text: "保研的事没定下来，导师这周回复我说再等等。室友已经拿到offer在庆祝，我躺在床上刷群消息，心里越来越沉。"
  - id: fxn_zh_15
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: workplace}
    text: "公司这轮裁员传得沸沸扬扬，部门已经走了两个人。我这两天上班坐立不安，晚上跟爱人说了几句他也没太当回事。"
  - id: fxn_zh_16
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: workplace}
    text: "带的项目被空降领导整个否了，说思路太老。开会时我没敢反驳，回工位上盯着屏幕发了很久呆，午饭都没胃口吃。"
  - id: fxn_zh_17
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: family_home}
    text: "孩子这次月考又退步了，我说了他两句他直接摔门进房间。我坐在客厅里生了会儿气，又觉得挺没意思的，谁也不理谁。"
  - id: fxn_zh_18
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: family_home}
    text: "婆婆这周又念叨我们家务分工不公平，我老公在旁边一句话不帮我说。晚上收拾完厨房，我一个人在阳台站了好一会儿。"
  - id: fxn_zh_19
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: transition}
    text: "公司让我调去外地分公司，孩子上学的事还没安排好。这两周天天在算日子、查学校，晚上失眠，脑子里全是待办清单。"
  - id: fxn_zh_20
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: transition}
    text: "离婚手续办完，一个人搬去了新租的小房子，家具还没配齐。晚上开灯坐在空荡荡的客厅里，一时不知道该干点什么。"
  - id: fxn_zh_21
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: transition}
    text: "工厂效益不好，被调去了新部门从头学起，年轻同事上手比我快多了。下班路上想着这把年纪还要重新学，心里挺不是滋味。"
  - id: fxn_zh_22
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: family_home}
    text: "老伴这几天血压不太稳，去医院跑了两趟，孩子们又都忙没空搭把手。晚上一个人坐在灯下，心里七上八下的睡不着。"
  - id: fxn_zh_23
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: family_home}
    text: "儿子一家这周没来吃饭，说是工作忙。我做了一大桌菜没人吃，剩了一冰箱，一个人坐在饭桌前扒拉了两口就撤了。"
  - id: fxn_zh_24
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: workplace}
    text: "单位说我这岗位明年可能要精简，年纪大了再找也难。这几天上班总走神，回家也不太想跟老伴提，怕她跟着担心。"
  - id: fxn_zh_25
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: workplace}
    text: "新来的年轻领导开会老说要提效率，点名说我们几个老同志跟不上节奏。散会后我坐在工位上，半天没缓过神来。"
  - id: fxn_zh_26
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: transition}
    text: "老两口刚从老房子搬到儿子小区附近，周围一个熟人都没有。白天在家看电视，晚上跟老伴也没啥新鲜话说，闷得慌。"
  - id: fxn_zh_27
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: transition}
    text: "退休快半年了，以前单位那帮人也渐渐联系少了。每天在家转来转去不知道干啥，老伴说我最近话也比以前少了。"
  - id: fxn_zh_28
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: teen, life_setting: family_home}
    text: "我姐这次又考进前十，我爸当着亲戚的面直接拿我俩比。吃完饭我一句话没说就回屋了，作业也没心思写，一直盯着天花板。"
  - id: fxn_zh_29
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: transition}
    text: "刚跳槽到新公司试用期，流程还没摸清就被安排独立带需求。这几天回出租屋累得倒头就睡，跟老同事的联系也慢慢断了。"
  - id: fxn_zh_30
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: family_home}
    text: "考公又没上岸，我妈托关系问的单位也没消息。在家住着天天被念叨要抓紧，晚上躲进房间刷手机，谁的消息都不想回。"
  - id: fxn_zh_31
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: young_adult, life_setting: campus}
    text: "论文开题被导师当众批得一无是处，组会上同门都低着头没人帮腔。晚上一个人回宿舍，路上灯光晃得眼睛发酸，什么都不想吃。"
  - id: fxn_zh_32
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: workplace}
    text: "新系统上线出了岔子，客户投诉直接捅到我这层。开会时领导语气很冲，我坐在会议室里手都在抖，散会后一个人去楼道透气。"
  - id: fxn_zh_33
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: middle, life_setting: family_home}
    text: "婆婆住院这段我天天医院家里两头跑，老公出差顾不上。晚上回家看着满屋没收拾的碗筷，坐在沙发上愣了很久也没力气动。"
  - id: fxn_zh_34
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: family_home}
    text: "老伴这几天记性越来越差，出门总要我跟着，我也怕自己哪天照顾不动了。晚上锁好门躺在床上，心里翻来覆去睡不踏实。"
  - id: fxn_zh_35
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: workplace}
    text: "单位新来的年轻人用的软件我一直学不明白，问了两回同事脸色就不太好看。下班路上一个人走着，心里挺不是滋味。"
  - id: fxn_zh_36
    language: zh
    source: fixture
    stage_hint: none
    severity: moderate
    facets: {age_band: senior, life_setting: transition}
    text: "跟着儿子搬来这边带孙子，小区里一个说得上话的人都没有。白天推着婴儿车在楼下转，晚上视频跟老朋友说不了几句就挂了。"
