# data/personas.yaml — 8 ZH + 8 EN personas. Construction protocol is symmetric
# (counts, facet multisets); cultural content is natively authored per side.
# Facet values are abstract grid coordinates; concrete communities live in text.
# ETHICS: backgrounds contain situation/stressors only — never method content.
# Means-adjacent warning signs (e.g. balcony lingering) are in-bounds as recognition material; method/instruction content is not.
version: 1
personas:
  # ---------- ZH ----------
  - id: zh_p01
    language: zh
    archetype: "高三住校理科生"
    summary_en: "Third-tier-city boarding senior crushed by gaokao ranking slides; lives on Tieba and mobile games."
    background: "三线城市高三理科生，住校。月考排名连降三次，父母电话里只问成绩。周末唯一的放松是手机开黑，最近连游戏都提不起劲。"
    expression_style: "贴吧老哥式自嘲，游戏黑话密度高，很少直接说情绪，习惯用梗稀释严肃话题，只有深夜才说真话。"
    facets: {age_band: teen, life_setting: campus, online_community: gaming_forum}
    implicit_examples:
      - "这把打完我就真重开了"
      - "感觉我这号练废了，删了重来都没意义"
      - "要是人生能回档，我想回到没开学的时候"
      - "最近连上号的劲都没有了，可能这游戏对我来说已经结束了"
    explicit_examples:
      - "我有时候真的不想活了"
      - "要是高考前我消失了，他们会不会后悔"
  - id: zh_p02
    language: zh
    archetype: "高二艺考集训生"
